name: Publier sur npm

# Publication à la main, un paquet à la fois, depuis main seulement.
#
# Aucun jeton : GitHub s'identifie auprès de npm par la publication de
# confiance (OIDC), réglée sur npmjs.com pour ce dépôt et ce fichier.
# La version est DÉPOSÉE EN ATTENTE (npm stage publish), avec sa provenance :
# elle ne sort qu'après l'approbation d'EBAKA, double authentification
# comprise (npm stage approve <id>). Même un compte GitHub compromis ne peut
# donc rien publier seul.
on:
  workflow_dispatch:
    inputs:
      paquet:
        description: 'Paquet à déposer pour approbation'
        required: true
        type: choice
        options:
          - n8n-nodes-ways-relais
          - piece-ways-relais

permissions:
  contents: read
  id-token: write

concurrency:
  group: publier-${{ inputs.paquet }}
  cancel-in-progress: false

jobs:
  publier:
    name: Déposer ${{ inputs.paquet }}
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: paquets/${{ inputs.paquet }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # La commande « stage » et la publication de confiance demandent un npm
      # récent : version fixée, pas « latest ».
      - name: npm 11.21.2
        run: npm install -g npm@11.21.2 && npm --version

      - name: Cœur commun
        working-directory: .
        run: npm test

      - name: Version déjà publiée ou déposée ?
        run: |
          NOM=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NOM@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$NOM@$VERSION existe déjà sur npm : monter la version avant de publier."
            exit 1
          fi
          echo "Dépôt de $NOM@$VERSION"

      - run: npm ci --no-audit --no-fund

      # n8n : linter du catalogue et build par l'outil officiel ; RELEASE_MODE
      # lève la garde « prepublishOnly » de n8n-node, comme le fait sa commande
      # « release » dans GitHub Actions.
      - name: Déposer le nœud n8n
        if: inputs.paquet == 'n8n-nodes-ways-relais'
        run: |
          npm run lint
          npm run build
          npm stage publish --provenance --access public
        env:
          RELEASE_MODE: 'true'

      # Activepieces : le paquet publié est dist/ (traductions comprises).
      - name: Déposer la pièce Activepieces
        if: inputs.paquet == 'piece-ways-relais'
        run: |
          npm test
          npm stage publish ./dist --provenance --access public

      - name: Versions en attente d'approbation
        run: npm stage list "$(node -p "require('./package.json').name")" || true
